# Optional reminder only — Ironman API is deployed locally with Pulumi (no GitHub OIDC).
# See ironman/api/deploy.sh and ironman/api/README.md.

name: Deploy Ironman API (local only)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow does not deploy. Run ironman/api/deploy.sh on a machine with AWS credentials."
        required: false
        default: "use local deploy.sh"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Local deploy instructions
        run: |
          cat <<'EOF'
          GitHub OIDC is intentionally not used for Ironman.

          Deploy from your laptop with AWS profile credentials:

            cd ironman/api
            export AWS_PROFILE=umesh
            export IRONMAN_PIN=XXXX
            ./deploy.sh

          That runs Pulumi against s3://skalekontrol/pulumi/ironman and updates ironman/api-config.js.
          EOF
          exit 1
