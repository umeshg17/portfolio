# Phase 1 Hybrid Athlete Foundation Plan
# Edit this file and refresh /ironman — no HTML changes needed.

meta:
  badge: "Private · Phase 1"
  title: "Phase 1 (Months 1–4) Hybrid Athlete Foundation Plan"
  description: >-
    This is the first phase of a 2-year journey towards an athletic physique
    and completing IRONMAN 70.3. Repeat the workout cycle continuously. It is
    NOT tied to weekdays. If you miss a workout, continue with the next workout
    in the cycle.
  footer: >-
    Cycle is continuous — not tied to weekdays. Miss a session → pick up at the
    next workout in order.

habits:
  title: "Daily Non-Negotiables"
  items:
    - name: Protein
      target: "130–140 g/day"
      details:
        - "Spread across 4–5 meals"
        - "Prioritize eggs, paneer, soya, curd, whey, dal"

    - name: Water
      target: "3–3.5 L/day"
      details:
        - "Increase on long runs"
        - "Include electrolytes on sessions >90 min"

    - name: Sleep
      target: "7.5–8.5 hours"
      details:
        - "Same sleep/wake time every day"

    - name: Steps
      target: "8,000–10,000/day"
      details:
        - "In addition to your running workout"

    - name: Mobility
      target: "Daily · context-aware"
      details:
        - "Daily habit — not the full routine every time"
        - "Strength/Run days: warm-up + post stretch"
        - "Recovery day (Workout #7): full 15–20 min routine"
        - "See Mobility Guide below for exact drills"

    - name: Vegetables
      target: "2 bowls/day (300–400 g)"
      details:
        - "Lunch: 1 bowl"
        - "Dinner: 1 bowl"
        - "Mix leafy greens, carrots, cucumber, beans, broccoli/cauliflower, capsicum, tomato."

    - name: Fruits
      target: "2 servings/day"
      details:
        - "Prefer banana around workouts"
        - "One seasonal fruit"

    - name: Sunlight
      target: "10–15 min"
      details:
        - "Morning if possible"

    - name: Workout Log
      target: "After every workout"
      details:
        - "Workout completed"
        - "Run distance"
        - "Reps"
        - "Body weight (weekly)"
        - "Energy level"

workouts:
  title: "Workout Cycle"
  items:
    - id: 1
      goal: "Upper Push + Core"
      day_type: "Strength Day"
      cardio: "10k steps"
      duration: "70 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-workout Stretch (5 min)"
      exercises:
        - "Dead Hang 3×45s"
        - "Scapular Pull-ups 3×10"
        - "Push-ups 4×10–20"
        - "Feet Elevated Push-ups 3×8–12"
        - "Chair Dips 3×12"
        - "DB Shoulder Press 4×10–12"
        - "DB Lateral Raise 4×15"
        - "Pike Push-ups 3×10"
        - "DB Overhead Triceps Extension 3×12"
        - "Hanging Knee Raise 3×10"
        - "Plank 3×60s"

    - id: 2
      goal: "Easy Run"
      day_type: "Run Day"
      cardio: "Run"
      duration: "45–60 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-run Stretch (5–10 min)"
      exercises:
        - "Zone-2 Run 5–7 km"
        - "Hip Flexor Stretch"
        - "Hamstring Stretch"
        - "Calf Stretch"
        - "Shoulder Mobility"
        - "Thoracic Rotation"
        - "Dead Hang 2×45s"

    - id: 3
      goal: "Legs + Core"
      day_type: "Strength Day"
      cardio: "10k steps"
      duration: "70 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-workout Stretch (5 min)"
      exercises:
        - "Goblet Squat 4×15"
        - "Bulgarian Split Squat 3×10/leg"
        - "Romanian Deadlift 4×12"
        - "Walking Lunges 3×20"
        - "Single-leg Glute Bridge 3×15"
        - "Standing Calf Raise 4×20"
        - "Hollow Hold 3×30s"
        - "Russian Twist 3×20"

    - id: 4
      goal: "Back + Arms"
      day_type: "Strength Day"
      cardio: "10k steps"
      duration: "70 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-workout Stretch (5 min)"
      exercises:
        - "Negative Pull-ups 5×5"
        - "Assisted Pull-ups 3×6"
        - "One-arm DB Row 4×12"
        - "Backpack Row 4×15"
        - "Rear Delt Fly 4×15"
        - "DB Curl 4×12"
        - "Hammer Curl 3×12"
        - "Reverse Curl 3×12"
        - "Farmer Carry 3×45s"
        - "Side Plank 3×45s"

    - id: 5
      goal: "Long Run"
      day_type: "Run Day"
      cardio: "Long Run"
      duration: "60–100 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-run Stretch (5–10 min)"
      exercises:
        - "Start 6 km and progress to 12 km over 4 months"
        - "10 min cool-down walk"
        - "10 min stretching"

    - id: 6
      goal: "Athletic Strength"
      day_type: "Strength Day"
      cardio: "10k steps"
      duration: "75 min"
      mobility:
        - "Dynamic Warm-up (5 min)"
        - "Post-workout Stretch (5 min)"
      exercises:
        - "Push-ups 3×Max"
        - "Pull-up Negatives 3×5"
        - "Goblet Squat 3×15"
        - "Romanian Deadlift 3×15"
        - "DB Shoulder Press 3×12"
        - "One-arm Row 3×12"
        - "Mountain Climbers 3×20"
        - "Burpees 3×10"
        - "Jump Squats 3×15"
        - "Plank 2×60s"

    - id: 7
      goal: "Recovery"
      day_type: "Recovery Day"
      cardio: "Easy"
      duration: "45–90 min"
      mobility:
        - "Full Mobility Routine (15–20 min)"
      exercises:
        - "Choose ONE of the following"
        - "Easy Cycling 45–60 min"
        - "Easy Swimming 800–1000 m"
        - "Badminton 60 min"
        - "Brisk Walk 45 min"

mobility:
  title: "Mobility Guide"
  intro:
    - "Mobility is a daily habit for hybrid athlete + Ironman + muscle building"
    - "You do not need the full routine every time"
    - "Fit it into the workout flow instead of a separate checklist item"
  schedule:
    title: "When to do it"
    items:
      - when: "Before every workout"
        duration: "5–10 min"
        what: "Dynamic mobility + warm-up"
      - when: "After every workout"
        duration: "5–10 min"
        what: "Static stretching"
      - when: "Rest / Recovery day"
        duration: "15–20 min"
        what: "Full mobility routine"
  checklist:
    title: "By day type"
    items:
      - day: "Strength Day"
        checks:
          - "Dynamic Warm-up (5 min)"
          - "Post-workout Stretch (5 min)"
      - day: "Run Day"
        checks:
          - "Dynamic Warm-up (5 min)"
          - "Post-run Stretch (5–10 min)"
      - day: "Recovery Day"
        checks:
          - "Full Mobility Routine (15–20 min)"
  routines:
    - name: "Before a workout (Dynamic Mobility)"
      purpose: "Prepares joints and muscles for movement"
      duration: "5–8 min"
      items:
        - "Arm circles – 10 each direction"
        - "Cat-Cow – 10 reps"
        - "World's Greatest Stretch – 5 per side"
        - "Leg swings (front/back & side) – 10 per leg"
        - "Hip circles – 10 each direction"
        - "Bodyweight squats – 10"
        - "Dead hang – 30–45 seconds (before upper-body workouts)"

    - name: "After a workout (Static Mobility)"
      purpose: "Improves flexibility and recovery"
      duration: "5–10 min"
      note: "Hold each stretch for 30–60 seconds"
      items:
        - "Hip flexor stretch"
        - "Hamstring stretch"
        - "Calf stretch"
        - "Child's pose"
        - "Chest stretch (after push workouts)"
        - "Lat stretch (after pull workouts)"

    - name: "Recovery Day (Full Routine)"
      purpose: "Once every workout cycle — Workout #7"
      duration: "15–20 min"
      items:
        - "Hip Flexor Stretch – 1 min/side"
        - "Hamstring Stretch – 1 min/side"
        - "Calf Stretch – 1 min/side"
        - "World's Greatest Stretch – 5/side"
        - "Cat-Cow – 10 reps"
        - "Thoracic Rotation – 10/side"
        - "Shoulder Wall Slides – 15 reps"
        - "Child's Pose – 1 min"

running:
  title: "Running Progression"
  columns:
    - Month
    - Easy Run
    - Long Run
  rows:
    - [1, "5 km", "6 km"]
    - [2, "6 km", "8 km"]
    - [3, "6–7 km", "10 km"]
    - [4, "7 km", "12 km"]
