<!DOCTYPE html>g o
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Execution — Phase 1</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0a0f0c">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --bg: #0a0f0c;
      --surface: #141c17;
      --surface-2: #1a241e;
      --surface-3: #212c25;
      --text: #e8eee9;
      --muted: #8fa094;
      --muted-2: #6b7a70;
      --accent: #34d399;
      --accent-bright: #5eead4;
      --accent-dim: rgba(52, 211, 153, 0.12);
      --accent-border: rgba(52, 211, 153, 0.35);
      --done: #34d399;
      --done-bg: rgba(52, 211, 153, 0.1);
      --border: rgba(232, 238, 233, 0.08);
      --border-strong: rgba(232, 238, 233, 0.14);
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --max: 720px;
      --sticky-offset: 0px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      user-select: text;
      background:
        radial-gradient(ellipse 90% 45% at 50% -10%, rgba(52, 211, 153, 0.09), transparent 55%),
        radial-gradient(ellipse 50% 30% at 100% 40%, rgba(94, 234, 212, 0.04), transparent 50%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none;
    }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 1.25rem clamp(0.9rem, 3.5vw, 1.35rem) 3.5rem;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-bright);
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
    }
    .reset-day {
      font-size: 0.75rem;
      color: var(--muted-2);
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .reset-day:hover { color: var(--text); border-color: var(--border-strong); }
    h1 {
      font-size: clamp(1.45rem, 4.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin: 0 0 0.35rem;
    }
    .lede {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 0.25rem;
    }
    .phase {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted-2);
      letter-spacing: 0.03em;
      margin: 0 0 1.1rem;
    }

    /* Sticky progress */
    .progress-sticky {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: 0 calc(-1 * clamp(0.9rem, 3.5vw, 1.35rem)) 1.25rem;
      padding: 0.65rem clamp(0.9rem, 3.5vw, 1.35rem) 0.75rem;
      background: color-mix(in oklab, var(--bg) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }
    .progress-head h2 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border: 0;
      padding: 0;
    }
    .progress-pct {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--accent);
    }
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
    }
    @media (min-width: 560px) {
      .progress-grid { grid-template-columns: repeat(5, 1fr); }
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.45rem 0.4rem 0.5rem;
      text-align: center;
      min-width: 0;
    }
    .stat.done {
      border-color: var(--accent-border);
      background: var(--done-bg);
    }
    .stat-label {
      display: block;
      font-size: 0.62rem;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
    }
    .stat-value .goal { color: var(--muted-2); font-weight: 500; }
    .stat-bar {
      height: 3px;
      background: var(--surface-3);
      border-radius: 99px;
      margin: 0.35rem 0 0.3rem;
      overflow: hidden;
    }
    .stat-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.25s var(--ease);
    }
    .stat-ctrls {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
    }
    .stat-ctrls button {
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .stat-ctrls button:hover {
      color: var(--accent);
      border-color: var(--accent-border);
    }
    .stat.checklist-mode .stat-ctrls { display: none; }
    .protein-log {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }
    .protein-log-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }
    .protein-log-head h3 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .protein-log-hint {
      font-size: 0.72rem;
      color: var(--muted-2);
    }
    .protein-log .checks {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    @media (min-width: 520px) {
      .protein-log .checks {
        grid-template-columns: 1fr 1fr;
      }
    }
    .protein-log .check-meta {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted-2);
      flex-shrink: 0;
    }
    .protein-log .check.done .check-meta {
      color: var(--accent-bright);
    }
    .water-log {
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }
    .water-log-hint {
      margin: 0 0 0.7rem;
      font-size: 0.78rem;
      color: var(--muted-2);
      line-height: 1.4;
    }
    .bottle-add {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-bright);
      font-weight: 600;
      margin-bottom: 0.65rem;
    }
    .bottle-add:hover:not(:disabled) { background: rgba(52, 211, 153, 0.18); }
    .bottle-add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .bottle-last {
      margin: 0 0 0.25rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--accent-bright);
    }
    .bottle-cooldown {
      margin: 0 0 0.7rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .bottle-cooldown.wait { color: var(--danger); }
    .bottle-toggle {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.55rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .bottle-toggle.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .bottle-toggle input {
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--accent);
    }
    .bottle-empty {
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted-2);
    }
    .bottle-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .bottle-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.65rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .bottle-main {
      font-weight: 600;
      font-size: 0.88rem;
    }
    .bottle-time {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent-bright);
    }
    .bottle-undo {
      font-size: 0.72rem;
      color: var(--muted-2);
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .bottle-undo:hover { color: var(--text); border-color: var(--border-strong); }

    /* Next up */
    .next-up {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      margin-bottom: 1.15rem;
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .next-up.complete {
      border-color: var(--accent-border);
      background: var(--done-bg);
    }
    .next-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.15rem;
    }
    .next-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .next-meta {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .next-icon {
      flex-shrink: 0;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 10px;
      background: var(--accent-dim);
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .next-icon svg { width: 1.25rem; height: 1.25rem; }

    /* Timeline sections */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      position: relative;
    }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s var(--ease);
    }
    .section.open { border-color: var(--border-strong); }
    .section.primary {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .section.all-done {
      border-color: color-mix(in oklab, var(--accent) 40%, transparent);
    }
    .section-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.85rem 0.95rem;
      text-align: left;
    }
    .section-head:hover { background: color-mix(in oklab, var(--surface-2) 70%, transparent); }
    .sec-icon {
      flex-shrink: 0;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--accent-bright);
      display: grid;
      place-items: center;
    }
    .sec-icon svg { width: 1.1rem; height: 1.1rem; }
    .section.all-done .sec-icon {
      background: var(--done-bg);
      color: var(--done);
    }
    .sec-titles { flex: 1; min-width: 0; }
    .sec-titles h3 {
      margin: 0;
      font-size: 0.98rem;
      font-weight: 650;
      letter-spacing: -0.015em;
    }
    .sec-sub {
      margin: 0.1rem 0 0;
      font-size: 0.75rem;
      color: var(--muted-2);
    }
    .sec-count {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted-2);
      flex-shrink: 0;
    }
    .section.all-done .sec-count { color: var(--done); }
    .chev {
      flex-shrink: 0;
      color: var(--muted-2);
      transition: transform 0.2s var(--ease);
    }
    .section.open .chev { transform: rotate(180deg); }
    .section-body {
      display: none;
      padding: 0 0.95rem 0.95rem;
      border-top: 1px solid var(--border);
    }
    .section.open .section-body { display: block; padding-top: 0.75rem; }
    .sec-note {
      margin: 0 0 0.65rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .sec-note strong { color: var(--accent); font-weight: 600; }
    .suggest {
      margin: 0 0 0.85rem;
      padding: 0.65rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .suggest-label {
      margin: 0 0 0.4rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .suggest-list {
      margin: 0;
      padding: 0 0 0 1.05rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .suggest-list li { margin: 0.2rem 0; }

    /* Checklist */
    .checks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      padding: 0.55rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      user-select: text;
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .check:hover { background: var(--surface-2); }
    .check.done {
      background: var(--done-bg);
      border-color: color-mix(in oklab, var(--accent) 25%, transparent);
    }
    .check.done .check-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: color-mix(in oklab, var(--accent) 45%, transparent);
    }
    .box {
      flex-shrink: 0;
      width: 1.2rem;
      height: 1.2rem;
      margin-top: 0.08rem;
      border: 1.5px solid var(--muted-2);
      border-radius: 5px;
      display: grid;
      place-items: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .check.done .box {
      background: var(--done);
      border-color: var(--done);
      color: var(--bg);
    }
    .box svg { width: 0.75rem; height: 0.75rem; opacity: 0; }
    .check.done .box svg { opacity: 1; }
    .check-text {
      flex: 1;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    /* Reminder pills */
    .reminder {
      margin: 0 0 0.75rem;
      padding: 0.65rem 0.75rem;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px dashed var(--border-strong);
    }
    .reminder-label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 0.4rem;
    }
    .reminder-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .reminder-items li {
      font-size: 0.78rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
    }

    /* Plate */
    .plate {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
      margin: 0 0 0.75rem;
    }
    @media (min-width: 480px) {
      .plate { grid-template-columns: repeat(3, 1fr); }
    }
    .plate-third {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.7rem;
    }
    .plate-third h4 {
      margin: 0 0 0.4rem;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }
    .plate-third ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .plate-third li { margin: 0.15rem 0; }

    /* Workout card (primary) */
    .wo-card { margin-top: 0.15rem; }
    .wo-header {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .wo-num {
      flex-shrink: 0;
      width: 2.4rem;
      height: 2.4rem;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      border-radius: 9px;
    }
    .wo-card h4 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .wo-type {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }
    .wo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.55rem 0 0.85rem;
      padding: 0;
      list-style: none;
    }
    .wo-meta li {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 0.28rem 0.5rem;
      border-radius: 6px;
    }
    .ex-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .ex-table th {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      text-align: left;
      padding: 0.35rem 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    .ex-table td {
      padding: 0.45rem 0.4rem;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      vertical-align: top;
    }
    .ex-table tr:last-child td { border-bottom: 0; }
    .ex-table td:first-child { color: var(--text); font-weight: 500; width: 55%; }
    .ex-table td:nth-child(2),
    .ex-table td:nth-child(3) {
      font-family: var(--mono);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .mobility-list {
      margin: 0 0 0.85rem;
      padding: 0;
      list-style: none;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .mobility-list li {
      padding: 0.2rem 0 0.2rem 1rem;
      position: relative;
    }
    .mobility-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55rem;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
    }
    .mobility-block {
      margin: 0 0 0.85rem;
      padding: 0.7rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .mobility-block.done {
      border-color: var(--accent-border);
      background: var(--done-bg);
    }
    .mobility-block-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .mobility-block-head h4 {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .mobility-count {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted-2);
    }
    .mobility-block .checks { margin: 0; }
    .section-body > .mobility-block { margin-top: 0.35rem; }
    .wo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      flex: 1;
      min-width: 10rem;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary.done-state {
      background: var(--done-bg);
      color: var(--done);
      border: 1px solid var(--accent-border);
    }
    .btn-ghost {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

    /* Cycle & milestones */
    .block-title {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.75rem 0 0.65rem;
    }
    .cycle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    .cycle-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 0.95rem;
    }
    .cycle-card.current {
      border-color: var(--accent-border);
      background: var(--done-bg);
    }
    .cycle-card .tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin: 0 0 0.35rem;
    }
    .cycle-card.current .tag { color: var(--accent); }
    .cycle-card h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 650;
    }
    .cycle-card p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .run-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
    }
    @media (min-width: 480px) {
      .run-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .run-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 0.95rem;
      text-align: center;
    }
    .run-card .tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin: 0 0 0.3rem;
    }
    .run-card .val {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
      margin: 0;
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem;
    }
    @media (min-width: 560px) {
      .review-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .review-field {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.7rem;
    }
    .review-field label {
      display: block;
      font-size: 0.68rem;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.3rem;
    }
    .review-field input {
      width: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 0;
    }
    .review-field input::placeholder { color: var(--muted-2); opacity: 0.6; }

    footer.note {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted-2);
    }
    .loading { color: var(--muted); }
    .error { color: var(--danger); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    /* Unlock gate */
    .unlock-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(52, 211, 153, 0.12), transparent 55%),
        var(--bg);
    }
    .unlock-gate[hidden] { display: none; }
    .unlock-card {
      width: min(100%, 360px);
      text-align: center;
    }
    .unlock-card h1 {
      font-size: 1.5rem;
      margin: 0 0 0.35rem;
    }
    .unlock-card .lede {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 1.35rem;
    }
    .unlock-pin {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .unlock-pin input {
      width: 3rem;
      height: 3.25rem;
      text-align: center;
      font-family: var(--mono);
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      outline: 0;
      caret-color: var(--accent);
    }
    .unlock-pin input:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .unlock-submit {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent-bright);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .unlock-submit:hover { background: rgba(52, 211, 153, 0.18); }
    .unlock-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .unlock-error {
      min-height: 1.25rem;
      margin: 0.75rem 0 0;
      font-size: 0.85rem;
      color: var(--danger);
    }
    .sync-status {
      font-size: 0.7rem;
      color: var(--muted-2);
      font-family: var(--mono);
    }
    .sync-status.err { color: var(--danger); }
    .app-shell[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="unlock-gate" id="unlock-gate" hidden>
    <div class="unlock-card">
      <p class="badge" style="display:inline-block;margin-bottom:1rem">Phase 1</p>
      <h1>Unlock tracker</h1>
      <p class="lede">Enter the 4-digit PIN to sync across devices.</p>
      <form id="unlock-form" autocomplete="off">
        <div class="unlock-pin" id="unlock-pin">
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" data-pin-idx="0" autocomplete="off" />
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" data-pin-idx="1" autocomplete="off" />
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" data-pin-idx="2" autocomplete="off" />
          <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" data-pin-idx="3" autocomplete="off" />
        </div>
        <button type="submit" class="unlock-submit" id="unlock-submit" disabled>Unlock</button>
        <p class="unlock-error" id="unlock-error" role="alert"></p>
      </form>
    </div>
  </div>

  <div class="wrap app-shell" id="app-shell" hidden>
    <div class="topbar">
      <span class="badge" id="badge">…</span>
      <div style="display:flex;align-items:center;gap:0.65rem">
        <span class="sync-status" id="sync-status" aria-live="polite"></span>
        <button type="button" class="reset-day" id="reset-day" title="Clear today's checkboxes and progress">Reset day</button>
      </div>
    </div>
    <h1 id="title" class="loading">Loading…</h1>
    <p class="lede" id="subtitle"></p>
    <p class="phase" id="phase"></p>

    <div class="progress-sticky" id="progress-sticky" hidden>
      <div class="progress-head">
        <h2 id="targets-title">Today's Progress</h2>
        <span class="progress-pct" id="progress-pct"></span>
      </div>
      <div class="progress-grid" id="progress-grid"></div>
      <div class="protein-log" id="protein-log" hidden></div>
      <div class="water-log" id="water-log" hidden></div>
    </div>

    <div class="next-up" id="next-up" hidden></div>

    <div class="timeline" id="timeline"></div>

    <h2 class="block-title">Workout Cycle</h2>
    <div class="cycle-row" id="cycle-row"></div>

    <h2 class="block-title" id="longrun-title">Long Run Progress</h2>
    <div class="run-grid" id="run-grid"></div>

    <h2 class="block-title" id="review-title">Weekly Review</h2>
    <div class="review-grid" id="review-grid"></div>

    <footer class="note" id="footer"></footer>
  </div>

  <script src="api-config.js"></script>
  <script src="loader.js"></script>
</body>
</html>
