<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 1 — Hybrid Athlete Foundation</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0a0f0c">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --bg: #0a0f0c;
      --surface: #141c17;
      --surface-2: #1a241e;
      --text: #e8eee9;
      --muted: #8fa094;
      --muted-2: #6b7a70;
      --accent: #5eead4;
      --accent-dim: rgba(94, 234, 212, 0.12);
      --border: rgba(232, 238, 233, 0.08);
      --border-strong: rgba(232, 238, 233, 0.14);
      --radius: 12px;
      --max: 920px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 100% 0%, rgba(94, 234, 212, 0.07), transparent 55%),
        radial-gradient(ellipse 60% 40% at 0% 20%, rgba(52, 211, 153, 0.05), transparent 50%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2.5rem clamp(1.1rem, 4vw, 1.75rem) 4rem;
    }
    .topbar { margin-bottom: 2rem; }
    .badge {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid color-mix(in oklab, var(--accent) 30%, transparent);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
    }
    h1 {
      font-size: clamp(1.55rem, 4vw, 2.15rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0 0 0.85rem;
    }
    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 58ch;
      margin: 0 0 2.25rem;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin: 2.5rem 0 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    #habits-title { border-top: 0; padding-top: 0; }
    .habit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.85rem;
    }
    .habit {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.05rem 1.1rem;
    }
    .habit h3 { margin: 0; font-size: 0.95rem; font-weight: 650; }
    .target {
      margin: 0.25rem 0 0.55rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
    }
    .habit ul {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .habit ul, .ex, .meta, .checks { padding-left: 1.1rem; }
    .habit li, .ex li, .meta li, .checks li { margin: 0.2rem 0; }
    .habit ul strong {
      color: var(--text);
      font-weight: 600;
    }
    .day-type {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }
    .block { margin-top: 0.75rem; }
    .block h4 {
      margin: 0 0 0.35rem;
      font-size: 0.72rem;
      font-family: var(--mono);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      font-weight: 500;
    }
    .checks {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      list-style: none;
      padding-left: 0;
    }
    .checks li {
      position: relative;
      padding-left: 1.35rem;
    }
    .checks li::before {
      content: "☐";
      position: absolute;
      left: 0;
      color: var(--accent);
    }
    .note-line {
      margin: 0 0 0.5rem;
      font-size: 0.88rem;
      color: var(--muted-2);
      font-style: italic;
    }
    .section-lede {
      margin: -0.35rem 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .section-lede ul {
      margin: 0;
      padding-left: 1.1rem;
    }
    .section-lede li { margin: 0.2rem 0; }
    .subhead {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 1.35rem 0 0.75rem;
      letter-spacing: -0.01em;
      color: var(--text);
      border: 0;
      padding: 0;
    }
    .workout-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .workout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.05rem 1.15rem 1.15rem;
      transition: border-color 0.2s var(--ease);
    }
    .workout:hover { border-color: var(--border-strong); }
    .workout > header {
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .num {
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border-radius: 8px;
    }
    .workout h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .meta {
      margin: 0.35rem 0 0;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      color: var(--muted-2);
      list-style: disc;
    }
    .ex {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    @media (min-width: 640px) {
      .ex { columns: 2; column-gap: 1.5rem; }
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      background: var(--surface-2);
    }
    tr:last-child td { border-bottom: 0; }
    td:first-child {
      font-family: var(--mono);
      color: var(--accent);
      width: 4rem;
    }
    footer.note {
      margin-top: 2.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted-2);
    }
    .loading { color: var(--muted); }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="badge" id="badge">…</span>
    </div>
    <h1 id="title" class="loading">Loading plan…</h1>
    <p class="lede" id="description"></p>

    <h2 id="habits-title"></h2>
    <div class="habit-grid" id="habits"></div>

    <section id="mobility-section" hidden>
      <h2 id="mobility-title"></h2>
      <div class="section-lede" id="mobility-intro"></div>

      <h3 class="subhead" id="mobility-schedule-title"></h3>
      <div class="habit-grid" id="mobility-schedule"></div>

      <h3 class="subhead" id="mobility-checklist-title"></h3>
      <div class="habit-grid" id="mobility-checklist"></div>

      <h3 class="subhead">Routines</h3>
      <div class="workout-list" id="mobility-routines"></div>
    </section>

    <h2 id="workouts-title"></h2>
    <div class="workout-list" id="workouts"></div>

    <h2 id="running-title"></h2>
    <div id="running"></div>

    <footer class="note" id="footer"></footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="loader.js"></script>
</body>
</html>
